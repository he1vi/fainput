# ============================================================================
# fainput: 云端构建 APK
#
# 为什么要在云端编：
#   本机是 ARM64 安卓手机，SDK build-tools 里的 host 工具（aapt2 / aidl / ...）
#   是 x86_64 ELF，在 ARM64 上内核返回 ENOEXEC，shell 会把它当脚本解释，
#   报出极具误导性的 "Syntax error: word unexpected (expecting \")\")"。
#   云端是 x86_64，这些问题全部不存在。
#
# 本文件结构参考上游 .github/workflows/pull_request.yml（已按其验证过的组合）。
#
# 触发：任意分支 push，或手动 workflow_dispatch
# 产物：app/build/outputs/apk/debug/*.apk  →  Actions → Artifacts
# ============================================================================

name: Build APK

on:
  push:
  # 【fainput / L3】方案 C：
  #   平时 push  →  model_mode 默认 none  →  APK 保持 ~68MB，迭代快
  #   准备定版  →  手动 Run workflow 选 bundle  →  模型打进 APK（~537MB）
  #   想单独拿模型文件  →  选 artifact
  #
  # 为什么不做成"永远内置"：这条线路 ~38KB/s，537MB 要下 3.4 小时；
  # 而 GitHub Free 的 artifact 存储只有 500MB —— 一个包就爆额度。
  # 原生层的编译错误是要反复迭代的，不能每轮都赔上这些。
  workflow_dispatch:
    inputs:
      model_mode:
        description: "模型：none = 不带（快）/ artifact = 只产出模型文件 / bundle = 打进 APK（定版）"
        required: false
        default: "none"
        type: choice
        options:
          - none
          - artifact
          - bundle

      build_type:
        description: "构建类型：debug = 平时迭代 / release = 定版（不混淆 · 固定签名 · 覆盖安装不丢数据）"
        required: false
        default: "debug"
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

jobs:
  build:
    name: assembleDebug (arm64-v8a)
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Fetch source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android environment
        uses: android-actions/setup-android@v4

      - name: Install CMake
        # 与 Versions.kt 的 defaultCMake 一致。
        # NDK (28.0.13004108) 不显式安装 —— AGP 会按 ndkVersion 自动下载，
        # 上游 workflow 也是这么做的。
        run: |
          sdkmanager --install "cmake;3.31.6"

      - name: Install system dependencies
        # gettext 提供 msgfmt/msgmerge/xgettext；
        # extra-cmake-modules 提供 ECM（本仓库已 vendored 一份兜底，
        # lib/fcitx5/src/main/cpp/cmake/FindECM.cmake 会优先用 vendored 的）。
        run: |
          sudo apt update
          sudo apt install -y extra-cmake-modules gettext

      - name: Fetch llama.cpp (pinned tag)
        # 【fainput / L3】后台整理层的推理后端。
        #
        # 为什么不 vendor 进仓库：源码 ~40MB，而这条线路 push 只有 ~38KB/s，
        # 塞进仓库等于每次改一行都要多推十几分钟。CI 有快网，每次拉一遍更划算。
        #
        # 为什么**必须锁 tag**：llama.cpp 自己声明 ABI 不稳定
        # （docs/build.md 的 Notes），而且 API 改名极频繁
        # （`llama_load_model_from_file` → `llama_model_load_from_file` 就是一次）。
        # 这里跟它的正式 tag v0.5.0（正好等于 CMakeLists 里的版本号）。
        #
        # 拉不到/位置变了要**当场失败** —— 否则会退化成一个"没有 LLM"的 APK
        # 悄悄发出来，那种沉默降级最难查。
        run: |
          set -euo pipefail
          LLAMA_TAG=v0.5.0
          DEST=app/src/main/cpp/llama.cpp
          git clone --depth 1 --branch "$LLAMA_TAG" \
            https://github.com/ggml-org/llama.cpp "$DEST"
          echo "──── llama.cpp 已就位 ────"
          git -C "$DEST" log -1 --oneline
          test -f "$DEST/include/llama.h" || {
            echo "::error::llama.h 不在预期位置，CMake 的 EXISTS 守卫会静默降级"
            exit 1
          }

      - name: Fetch model (only when asked)
        # 【fainput / L3】方案 C 的"模型"那一步。默认不跑 —— push 构建保持 68MB。
        #
        # 地址是**核实过**的（不是猜的，猜错要白烧一次构建）：
        #   Qwen/Qwen2.5-0.5B-Instruct-GGUF 的 qwen2.5-0.5b-instruct-q4_k_m.gguf
        #   = 491,400,032 字节（469 MB）· Apache-2.0 · 支持断点续传
        #
        # 为什么是它：中文可用 / 许可干净 / 0.5B 是"能在手机上跑"的下限。
        # 再小（Q2/Q3 量化）对 0.5B 这种体量会明显说不成句。
        if: ${{ inputs.model_mode == 'artifact' || inputs.model_mode == 'bundle' }}
        run: |
          set -euo pipefail
          URL="https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf"
          OUT="model/qwen2.5-0.5b-instruct-q4_k_m.gguf"
          mkdir -p model
          curl -L --retry 3 --retry-delay 5 -o "$OUT" "$URL"
          ls -l "$OUT"
          # 469MB 才是对的。明显偏小 = 下到了错误页面（HF 会返回 HTML）
          test "$(stat -c %s "$OUT")" -gt 400000000 || {
            echo "::error::模型大小不对，可能下到了错误页面"
            exit 1
          }

      - name: Bundle model into APK assets
        # 必须**在 Gradle 构建之前** —— assets 是构建时打包进去的。
        if: ${{ inputs.model_mode == 'bundle' }}
        run: |
          mkdir -p app/src/main/assets/models
          cp model/*.gguf app/src/main/assets/models/
          ls -l app/src/main/assets/models/

      - name: Upload model as separate file
        # bundle 模式**不单独传** —— 模型已经在 APK 里了，
        # 再传一份等于 870MB，一次就把 500MB 的额度吃光。
        if: ${{ inputs.model_mode == 'artifact' }}
        uses: actions/upload-artifact@v7
        with:
          name: fainput-llm-model
          path: model/
          if-no-files-found: error

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install stable debug keystore
        # ★ 关键：AGP 发现 ~/.android/debug.keystore 不存在时会**随机生成**一个。
        #   后果是每次云端构建的签名都不同 → 覆盖安装被拒
        #   (INSTALL_FAILED_UPDATE_INCOMPATIBLE) → 必须先卸载 → 应用数据全丢。
        #   对一个"靠数据积累"的输入法来说这是致命的。
        #
        #   这里用仓库里固定的 signing/debug.keystore 覆盖它。
        #   alias=androiddebugkey / storepass=android 正是 AGP debug 签名的默认值，
        #   所以不需要改任何 gradle 配置。
        run: |
          mkdir -p "$HOME/.android"
          cp signing/debug.keystore "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          echo "--- 已安装的签名证书 ---"
          keytool -list -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey

      - name: Build APK
        # 【fainput / H】release = 定版：**不混淆（R8 关）** + 固定签名 + 保留 .debug 后缀
        # （保留后缀是为了覆盖安装不丢数据 —— 数据是按包名存的。）
        run: |
          chmod +x gradlew
          if [ "${{ inputs.build_type }}" = "release" ]; then
            echo "──── 构建 release（R8 关闭）────"
            ./gradlew :app:assembleRelease
          else
            echo "──── 构建 debug ────"
            ./gradlew :app:assembleDebug
          fi

      - name: "★ 策略门禁：零网络承诺"
        # fainput 的核心承诺是「数据不出设备」。
        # 这条门禁在**构建产物**上检查，而不是源码 manifest ——
        # 因为依赖库可能通过 manifest merger 偷偷注入权限。
        #
        # 一旦有人（或某个库）引入了 INTERNET 权限，构建当场失败。
        run: |
          # ⚠️ 这里**故意不开** `set -o pipefail` —— 开了它这一步必然失败，
          #    而且失败点和权限毫无关系，排查时会把人带偏：
          #    ① `find apk/debug apk/release` 两个目录**必有一个不存在**
          #       （build debug 时没有 release，反之亦然）⇒ find 退出码 1
          #    ② `| head -n1` 提前关掉管道 ⇒ find 收到 SIGPIPE ⇒ 退出码 141
          #    再叠上 `bash -e` ⇒ 脚本在这一行当场退出，
          #    后面的 `cat 权限清单` 和 `grep INTERNET` 一个字都不会跑。
          #
          #    2026-09-29 实际踩过：一次 release 构建里 `assembleRelease` 显示
          #    BUILD SUCCESSFUL，门禁却报 exit 1，日志里连"检查产物"都没打印出来。
          APK=$( (find app/build/outputs/apk/debug app/build/outputs/apk/release -name '*.apk' 2>/dev/null || true) | head -n1 )
          echo "检查产物: $APK"
          if [ -z "$APK" ]; then
            echo "::error::没找到 APK"
            exit 1
          fi

          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 2>/dev/null | sort -V | tail -n1)
          echo "aapt2: $AAPT2"
          "$AAPT2" dump permissions "$APK" > /tmp/perms.txt || true

          echo "──────── 权限清单 ────────"
          cat /tmp/perms.txt
          echo "──────────────────────────"

          if grep -q 'android.permission.INTERNET' /tmp/perms.txt; then
            echo "::error::★ 策略违规：APK 声明了 INTERNET 权限！"
            echo "::error::fainput 必须零网络。请检查新引入的依赖库。"
            exit 1
          fi

          echo "✅ 零网络承诺验证通过：产物未声明 INTERNET 权限"

      - name: List APK
        if: always()
        run: |
          find . -path '*/outputs/apk/*' -name '*.apk' -exec ls -lh {} \; || true

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          # release 与 debug 分开命名/分目录，避免拿错
          name: ${{ inputs.build_type == 'release' && 'fainput-release-arm64' || 'fainput-debug-arm64' }}
          path: app/build/outputs/apk/${{ inputs.build_type == 'release' && 'release' || 'debug' }}/
          if-no-files-found: error
          retention-days: 30