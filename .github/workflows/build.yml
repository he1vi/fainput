# ============================================================================
# fainput: 云端构建 APK
#
# 为什么要在云端编：
#   本机是 ARM64 安卓手机，SDK build-tools 里的 host 工具（aapt2 / aidl / ...）
#   是 x86_64 ELF，在 ARM64 上内核返回 ENOEXEC，shell 会把它当脚本解释，
#   报出极具误导性的 "Syntax error: word unexpected (expecting \")\")"。
#   云端是 x86_64，这些问题全部不存在。
#
# 本文件结构参考上游 .github/workflows/pull_request.yml（已按其验证过的组合）。
#
# 触发：任意分支 push，或手动 workflow_dispatch
# 产物：app/build/outputs/apk/debug/*.apk  →  Actions → Artifacts
# ============================================================================

name: Build APK

on:
  push:
  # 【fainput】手动触发时只需选一个东西：debug 还是 release。
  #
  # `model_mode` 那个输入 2026-09-30 删掉了 —— 大模型整条链已拆
  # （见 `InsightMaintenance` 的「叙述（已删除）」）。
  workflow_dispatch:
    inputs:
      build_type:
        description: "构建类型：debug = 平时迭代 / release = 定版（不混淆 · 固定签名 · 覆盖安装不丢数据）"
        required: false
        default: "debug"
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

jobs:
  build:
    name: assembleDebug (arm64-v8a)
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Fetch source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android environment
        uses: android-actions/setup-android@v4

      - name: Install CMake
        # 与 Versions.kt 的 defaultCMake 一致。
        # NDK (28.0.13004108) 不显式安装 —— AGP 会按 ndkVersion 自动下载，
        # 上游 workflow 也是这么做的。
        run: |
          sdkmanager --install "cmake;3.31.6"

      - name: Install system dependencies
        # gettext 提供 msgfmt/msgmerge/xgettext；
        # extra-cmake-modules 提供 ECM（本仓库已 vendored 一份兜底，
        # lib/fcitx5/src/main/cpp/cmake/FindECM.cmake 会优先用 vendored 的）。
        run: |
          sudo apt update
          sudo apt install -y extra-cmake-modules gettext

      # 【fainput】这里原来有 4 步：
      #   Fetch llama.cpp (pinned tag) / Fetch model / Bundle model into APK /
      #   Upload model as separate file
      #
      # 2026-09-30 大模型整条链拆掉（用户原话「那不要这个了」），全部删除。
      # 顺带省掉**每次构建都拉一遍 ~40MB llama.cpp 源码**的时间。
      #
      # ⚠️ LSTM（微 LM）不受影响 —— 它是 `assets/lstm/model.fnlstm`，
      #    在仓库里，不需要任何下载步骤。

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install stable debug keystore
        # ★ 关键：AGP 发现 ~/.android/debug.keystore 不存在时会**随机生成**一个。
        #   后果是每次云端构建的签名都不同 → 覆盖安装被拒
        #   (INSTALL_FAILED_UPDATE_INCOMPATIBLE) → 必须先卸载 → 应用数据全丢。
        #   对一个"靠数据积累"的输入法来说这是致命的。
        #
        #   这里用仓库里固定的 signing/debug.keystore 覆盖它。
        #   alias=androiddebugkey / storepass=android 正是 AGP debug 签名的默认值，
        #   所以不需要改任何 gradle 配置。
        run: |
          mkdir -p "$HOME/.android"
          cp signing/debug.keystore "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          echo "--- 已安装的签名证书 ---"
          keytool -list -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey

      - name: Build APK
        # 【fainput / H】release = 定版：**不混淆（R8 关）** + 固定签名 + 保留 .debug 后缀
        # （保留后缀是为了覆盖安装不丢数据 —— 数据是按包名存的。）
        run: |
          chmod +x gradlew
          if [ "${{ inputs.build_type }}" = "release" ]; then
            echo "──── 构建 release（R8 关闭）────"
            ./gradlew :app:assembleRelease
          else
            echo "──── 构建 debug ────"
            ./gradlew :app:assembleDebug
          fi

      - name: "★ 策略门禁：零网络承诺"
        # fainput 的核心承诺是「数据不出设备」。
        # 这条门禁在**构建产物**上检查，而不是源码 manifest ——
        # 因为依赖库可能通过 manifest merger 偷偷注入权限。
        #
        # 一旦有人（或某个库）引入了 INTERNET 权限，构建当场失败。
        run: |
          # ⚠️ 这里**故意不开** `set -o pipefail` —— 开了它这一步必然失败，
          #    而且失败点和权限毫无关系，排查时会把人带偏：
          #    ① `find apk/debug apk/release` 两个目录**必有一个不存在**
          #       （build debug 时没有 release，反之亦然）⇒ find 退出码 1
          #    ② `| head -n1` 提前关掉管道 ⇒ find 收到 SIGPIPE ⇒ 退出码 141
          #    再叠上 `bash -e` ⇒ 脚本在这一行当场退出，
          #    后面的 `cat 权限清单` 和 `grep INTERNET` 一个字都不会跑。
          #
          #    2026-09-29 实际踩过：一次 release 构建里 `assembleRelease` 显示
          #    BUILD SUCCESSFUL，门禁却报 exit 1，日志里连"检查产物"都没打印出来。
          APK=$( (find app/build/outputs/apk/debug app/build/outputs/apk/release -name '*.apk' 2>/dev/null || true) | head -n1 )
          echo "检查产物: $APK"
          if [ -z "$APK" ]; then
            echo "::error::没找到 APK"
            exit 1
          fi

          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 2>/dev/null | sort -V | tail -n1)
          echo "aapt2: $AAPT2"
          "$AAPT2" dump permissions "$APK" > /tmp/perms.txt || true

          echo "──────── 权限清单 ────────"
          cat /tmp/perms.txt
          echo "──────────────────────────"

          if grep -q 'android.permission.INTERNET' /tmp/perms.txt; then
            echo "::error::★ 策略违规：APK 声明了 INTERNET 权限！"
            echo "::error::fainput 必须零网络。请检查新引入的依赖库。"
            exit 1
          fi

          echo "✅ 零网络承诺验证通过：产物未声明 INTERNET 权限"

      - name: "★ 构建语言插件（日语 / 韩语 / 泰语 / 越南语 / 粤语 / 繁中 / 僧伽罗 / Rime）"
        # 【fainput / 多语言】主 APK 只带**中文系 + 英语**：
        #   inputmethod/ = pinyin · shuangpin · wbx · wbpy · zrm · db
        # 其它语言在 `plugin/` 下是**独立 APK**，运行时靠 intent 被发现
        #   （`DataManager.kt` → `pm.queryIntentActivities(PLUGIN_INTENT)`）。
        #
        # ⇒ 装哪个插件就多哪种语言，**不装的不占体积**，而且**不用重编主 APK**。
        #
        # ⚠️ `continue-on-error`：插件构建失败**不该拖垮主 APK 的交付**。
        #    失败会在这里标黄，看日志就知道是哪个语言的问题。
        continue-on-error: true
        run: |
          chmod +x gradlew
          if [ "${{ inputs.build_type }}" = "release" ]; then
            T=assembleRelease
          else
            T=assembleDebug
          fi
          echo "──── 构建语言插件（$T）────"
          ./gradlew \
            :plugin:hangul:$T \
            :plugin:thai:$T \
            :plugin:unikey:$T \
            :plugin:sayura:$T \
            :plugin:jyutping:$T \
            :plugin:chewing:$T \
            :plugin:anthy:$T \
            :plugin:rime:$T

      - name: List APK
        if: always()
        run: |
          find . -path '*/outputs/apk/*' -name '*.apk' -exec ls -lh {} \; || true

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          # release 与 debug 分开命名/分目录，避免拿错
          name: ${{ inputs.build_type == 'release' && 'fainput-release-arm64' || 'fainput-debug-arm64' }}
          path: app/build/outputs/apk/${{ inputs.build_type == 'release' && 'release' || 'debug' }}/
          if-no-files-found: error
          retention-days: 30

      - name: Upload 语言插件
        # 【fainput / 多语言】插件单独一个 artifact（文件名里带语言，一眼能挑）。
        # `if-no-files-found: ignore` —— 插件没编出来不该让整轮构建红。
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ inputs.build_type == 'release' && 'fainput-langplugins-release' || 'fainput-langplugins-debug' }}
          path: plugin/*/build/outputs/apk/*/*.apk
          if-no-files-found: ignore