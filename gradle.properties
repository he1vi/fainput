# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app"s APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
android.nonTransitiveRClass=true
# https://developer.android.com/build/optimize-your-build#disable-the-jetifier-flag
android.enableJetifier=false
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# KSP2 https://github.com/google/ksp/blob/main/docs/ksp2.md
ksp.useKSP2=true
# Build property overrides
# 【fainput 改动】只编 arm64-v8a。
# 上游留空 => 四种 ABI 全编，CI 上要多花约 4 倍时间和空间。
# 目标设备是 arm64，prebuilt 四种 ABI 齐全，收敛到一种不影响功能。
buildABI=arm64-v8a
#buildVersionName=
#buildCommitHash=
#buildTimestamp=

# --- 工具链版本：不在此处覆盖 ---
# 留空 => 使用 build-logic/convention/src/main/kotlin/Versions.kt 的上游默认值：
#     NDK        28.0.13004108
#     CMake      3.31.6
#     BuildTools 36.1.0
# CI（ubuntu-24.04 / x86_64）按 .github/workflows/build.yml 安装，全部原生可用。
#
# 【本机 AndroidCS / aarch64 构建说明 —— 仅供备忘，不影响 CI】
# 手机是 ARM64，SDK build-tools 里的 host 工具（aapt2/aidl/...）是 x86_64，
# 直接执行会报 "Syntax error: word unexpected (expecting \")\")"。
# 若要在手机上构建，把下面几行写进用户级 ~/.gradle/gradle.properties（不入库）：
#     android.aapt2FromMavenOverride=/data/data/com.tom.rv2ide/files/home/.androidide/aapt2
#     ndkVersion=29.0.14033849
#     cmakeVersion=4.1.2
#     buildTools=36.0.0
# 并先跑一次 fix-aidl.sh（把 build-tools/36.0.0 的 aidl 等换成 35.0.1 的 aarch64 版）。